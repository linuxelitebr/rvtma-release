apiVersion: v1
kind: Namespace
metadata:
  name: rvtma
  labels:
    app: rvtma
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rvtma
  namespace: rvtma
  labels:
    app: rvtma
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rvtma
  template:
    metadata:
      labels:
        app: rvtma
    spec:
      containers:
        - name: rvtma
          image: ghcr.io/elastocera/rvtma:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              # lualatex rendering a large migration-plan DocBook can spike
              # well past 2Gi and get OOM-killed mid-render. 4Gi gives the
              # big-estate PDF room; the request stays low so idle pods are
              # cheap.
              memory: "4Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: rvtma
  namespace: rvtma
  labels:
    app: rvtma
spec:
  selector:
    app: rvtma
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: rvtma
  namespace: rvtma
  labels:
    app: rvtma
  annotations:
    haproxy.router.openshift.io/timeout: 600s
spec:
  to:
    kind: Service
    name: rvtma
    weight: 100
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
